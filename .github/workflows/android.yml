name: Compilar TLOD para Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRAGOON_CONTENT_URL: ${{ vars.DRAGOON_CONTENT_URL }}
      DRAGOON_PACKAGE_APK: ${{ vars.DRAGOON_CONTENT_URL != '' }}
      DRAGOON_CONTENT_METADATA: android_app/content-download-0.30.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Preparar Android SDK y R8
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          fi
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          ln -s "$ANDROID_HOME" android-sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/r8-releases/raw/9.5.28/r8.jar \
            --output r8.jar

      - name: Compilar el motor y los componentes Android
        run: |
          bash source/gradlew -p source --no-daemon compileJava
          python3 project-tools/build_android_components.py

      - name: Empaquetar y verificar la APK
        env:
          DRAGOON_SIGNING_KEY_BASE64: ${{ secrets.DRAGOON_SIGNING_KEY_BASE64 }}
        run: |
          mkdir -p signing
          umask 077
          trap 'rm -f signing/debug.keystore' EXIT
          if [[ "$DRAGOON_PACKAGE_APK" == true ]]; then
            if [[ -z "$DRAGOON_SIGNING_KEY_BASE64" ]]; then
              echo "::error::Configura DRAGOON_SIGNING_KEY_BASE64 para publicar una APK."
              exit 1
            fi
            printf '%s' "$DRAGOON_SIGNING_KEY_BASE64" | base64 --decode > signing/debug.keystore
          else
            export DRAGOON_CONTENT_URL=https://example.invalid/TLOD-0.30-content.zip
            keytool -genkeypair -keystore signing/debug.keystore -storepass android \
              -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -dname "CN=TLOD CI" -validity 1
          fi
          python3 project-tools/build_internal_apk.py
          apk=android_app/build/Dragoon-Engine-Internal.apk
          bytes=$(stat -c %s "$apk")
          echo "APK verificada: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DRAGOON_PACKAGE_APK" != true ]]; then
            echo "Compilación de prueba. Configura la URL y la firma para entregar una APK." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p artifacts
          cp "$apk" artifacts/Legend-of-Dragoon-Remastered-0.30.apk
          cd artifacts
          sha256sum Legend-of-Dragoon-Remastered-0.30.apk > SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: env.DRAGOON_PACKAGE_APK == 'true'
        with:
          name: TLOD-Android-0.30
          path: artifacts/
          if-no-files-found: error
